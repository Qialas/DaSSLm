name: Release

# 两种发布方式：
#   1. 推送 tag：git tag v0.0.3 && git push origin v0.0.3
#   2. 在 GitHub 的 Actions 页面手动运行本工作流，填写版本号（例如 0.0.3），自动在 main 上打 tag
# 发布前请先把 admin-web/package.json 与 server/cmd/dasslm-server/main.go 的版本号改为新版本，
# 并在 README「更新说明」中添加「### v0.0.3」一节，作为 Release 说明。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 版本号（不带 v，例如 0.0.3）
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 确定版本号
        id: meta
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          version="${version#v}"
          if ! echo "${version}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "版本号格式应为 x.y.z：${version}" >&2; exit 1
          fi
          web=$(node -p "require('./admin-web/package.json').version")
          server=$(sed -n 's/^var version = "\(.*\)"/\1/p' server/cmd/dasslm-server/main.go)
          if [ "${web}" != "${version}" ] || [ "${server}" != "${version}" ]; then
            echo "代码中的版本号（admin-web=${web}, server=${server}）与发布版本 ${version} 不一致，请先修改代码中的版本号" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=v${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: 测试
        run: |
          (cd admin-web && npm ci && npm test)
          (cd server && CGO_ENABLED=1 go test ./...)

      - name: 构建管理端并嵌入服务端
        run: server/scripts/sync-admin-web.sh

      - name: 打包 amd64 / arm64
        run: |
          for arch in amd64 arm64; do
            GOARCH=${arch} VERSION=${{ steps.meta.outputs.version }} SKIP_WEB_BUILD=1 server/scripts/package-linux.sh
          done
          cd dist
          sha256sum *.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: 生成发布说明
        run: |
          tag=${{ steps.meta.outputs.tag }}
          awk -v h="### ${tag}" '$0==h{f=1;next} /^### /{f=0} /^## /{f=0} f' README.md > notes.md
          if [ ! -s notes.md ]; then
            echo "README 中没有找到「### ${tag}」一节，发布说明只包含下载信息" >&2
            echo "" > notes.md
          fi
          {
            echo ""
            echo "**下载**"
            echo "- \`dasslm-server-linux-amd64-${tag}.tar.gz\`：Linux x86_64"
            echo "- \`dasslm-server-linux-arm64-${tag}.tar.gz\`：Linux ARM64"
            echo ""
            echo "解压后修改 \`config/config.yaml\` 中的数据库连接，运行 \`./dasslm-server\`；升级时保留原有配置文件，只替换程序。"
            echo ""
            echo "**SHA256**"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } >> notes.md
          cat notes.md

      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ steps.meta.outputs.tag }}
          assets="dist/dasslm-server-linux-amd64-${tag}.tar.gz dist/dasslm-server-linux-arm64-${tag}.tar.gz dist/SHA256SUMS.txt"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" ${assets} --clobber
            gh release edit "${tag}" --notes-file notes.md
          else
            gh release create "${tag}" ${assets} --title "${tag}" --notes-file notes.md --target "${GITHUB_SHA}"
          fi
