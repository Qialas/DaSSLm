name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: 服务端测试
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l ./cmd ./internal)" || (gofmt -l ./cmd ./internal && exit 1)
      - name: go vet
        run: go vet ./...
      - name: go test
        run: CGO_ENABLED=1 go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  admin-web:
    name: 管理端构建
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-web/package-lock.json
      - run: npm ci
      - name: 单元测试
        run: npm test
      - name: 类型检查与构建
        run: npm run build
      - name: 依赖安全检查
        run: npm audit --omit=dev --audit-level=high

  version:
    name: 版本号一致性
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: package.json 与服务端版本号一致
        run: |
          web=$(node -p "require('./admin-web/package.json').version")
          server=$(sed -n 's/^var version = "\(.*\)"/\1/p' server/cmd/dasslm-server/main.go)
          echo "admin-web=${web} server=${server}"
          test "${web}" = "${server}"
